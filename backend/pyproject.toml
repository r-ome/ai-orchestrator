[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "orchestrator-backend"
version = "0.1.0"
description = "FastAPI backend for Orchestrator."
requires-python = ">=3.11"
dependencies = [
    "docker>=7.2,<8.0",
    "fastapi>=0.115,<1.0",
    "pyyaml>=6.0,<7.0",
    "requests>=2.32,<3.0",
    "uvicorn[standard]>=0.34,<1.0",
]

[project.optional-dependencies]
test = [
    "httpx>=0.28,<1.0",
    "pytest>=8.3,<10.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
